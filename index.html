<style>
  :root {
    /* Mason brand tokens — pulled from the app */
    --c-ink:      #1A1815;
    --c-ink-2:    #3A332A;
    --c-mute:     #7A7060;
    --c-mute-2:   #A89A86;
    --c-page:     #F2EEE5;
    --c-paper:    #FDFBF6;
    --c-paper-2:  #FFFFFF;
    --c-line:     #DED9CE;
    --c-line-2:   #C8BCA8;
    --c-deep:     #243D2E;     /* sidebar green */
    --c-deep-2:   #1A2D22;
    --c-acc:      #C2693B;     /* terracotta */
    --c-acc-lt:   #F5E8DC;
    --c-acc-dk:   #8A3A18;
    --c-grn:      #4A8A62;
    --c-blu:      #3A6A9A;
    --c-amb:      #C2693B;

    --ff-serif:   'Lora', Georgia, serif;
    --ff-display: 'Fraunces', 'Lora', Georgia, serif;
    --ff-script:  'Instrument Serif', 'Lora', Georgia, serif;
    --ff-body:    'DM Sans', -apple-system, system-ui, sans-serif;
    --ff-mono:    'JetBrains Mono', ui-monospace, monospace;

    --radius:     10px;
    --radius-sm:  6px;
  }

  /* Brand-accent swaps — applied via data-accent on <html>. Amber semantic stays
     terracotta regardless of accent. */
  html[data-accent="slate"]  { --c-acc: #5E6C7A; --c-acc-dk: #374151; --c-acc-lt: #E6EAEF; }
  html[data-accent="moss"]   { --c-acc: #6B7A48; --c-acc-dk: #404A28; --c-acc-lt: #ECEFDF; }
  html[data-accent="indigo"] { --c-acc: #4A5A8A; --c-acc-dk: #2A3560; --c-acc-lt: #E2E6F2; }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: var(--ff-body);
    background: var(--c-page);
    color: var(--c-ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "rlig" 1, "calt" 1, "ss01" 1;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  /* paper grain */
  .grain {
    background-image:
      radial-gradient(rgba(122,112,96,0.05) 1px, transparent 1px),
      radial-gradient(rgba(122,112,96,0.03) 1px, transparent 1px);
    background-size: 24px 24px, 7px 7px;
    background-position: 0 0, 12px 12px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(122,112,96,0.25); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(122,112,96,0.4); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* focus */
  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--c-acc);
    outline-offset: 2px;
  }

  /* container */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 20px; } }

  /* type utilities */
  .ff-serif   { font-family: var(--ff-serif); }
  .ff-display { font-family: var(--ff-display); }
  .ff-script  { font-family: var(--ff-script); }
  .ff-body    { font-family: var(--ff-body); }
  .ff-mono    { font-family: var(--ff-mono); }

  /* eyebrow */
  .eyebrow {
    font-family: var(--ff-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--c-mute);
  }

  /* shimmer for AI dots */
  @keyframes aiPulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  .ai-dot { animation: aiPulse 2.2s ease-in-out infinite; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .5s ease-out both; }

  /* tick mark for lists */
  .ticks li {
    position: relative; padding-left: 26px; margin-bottom: 10px;
    list-style: none; font-size: 15px; color: var(--c-ink-2);
  }
  .ticks li::before {
    content: ''; position: absolute; left: 4px; top: 9px;
    width: 12px; height: 6px; border-left: 1.6px solid var(--c-acc);
    border-bottom: 1.6px solid var(--c-acc); transform: rotate(-45deg);
  }
  .ticks { padding: 0; margin: 0; }

  /* hr */
  .rule { border: none; border-top: 1px solid var(--c-line); margin: 0; }

  /* placeholder helper used when we don't have real assets */
  .placeholder-img {
    background:
      repeating-linear-gradient(
        135deg,
        rgba(122,112,96,0.08) 0 12px,
        rgba(122,112,96,0.04) 12px 24px
      ),
      var(--c-paper);
    border: 1px solid var(--c-line);
    color: var(--c-mute);
    font-family: var(--ff-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
  }

  /* keep things crisp on hi-dpi */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

window.CTASection = function CTASection() {
  const c = CONTENT.cta;
  const [status, setStatus] = useState('idle'); // idle | sending | ok | err
  const [err, setErr] = useState('');

  const onSubmit = async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const data = new FormData(form);
    // honeypot — bots fill hidden field
    if (data.get('_honey')) return;
    setStatus('sending'); setErr('');
    try {
      const res = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(c.contact)}`, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: data,
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.success === 'true' || json.success === true) {
        setStatus('ok'); form.reset();
      } else {
        throw new Error(json.message || 'Submission failed');
      }
    } catch (e2) {
      setStatus('err'); setErr(e2.message || 'Something went wrong');

// auto-fits the app preview to its container
function ResponsivePreview({ view }) {
  const ref = React.useRef(null);
  const [scale, setScale] = useState(0.75);
  React.useEffect(() => {
    const calc = () => {
      if (!ref.current) return;
      const w = ref.current.clientWidth;
      setScale(Math.min(1, w / 1080));
    };
    calc();
    const ro = new ResizeObserver(calc);
    if (ref.current) ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden' }}>
      <div style={{ transformOrigin: 'top left' }}>
        <MasonAppPreview view={view} scale={scale}/>
      </div>
    </div>
  );
}

// In-page Tweaks panel — lets the user switch direction + toggle features.

window.TweaksPanel = function TweaksPanel({ tweaks, setTweaks, onClose }) {
  const set = (k, v) => {
    setTweaks(t => {
      const next = { ...t, [k]: v };
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch {}
      return next;

  const Section = ({ title, children }) => (
    <div style={{ padding: '14px 16px', borderTop: '1px solid var(--c-line)' }}>

      {children}

  );
  const Toggle = ({ label, k }) => (
    <label style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 0', cursor: 'pointer' }}>
      <span style={{ position: 'relative', width: 32, height: 18, borderRadius: 100, background: tweaks[k] ? 'var(--c-acc)' : 'var(--c-line-2)', transition: 'background .15s' }}>
        <span style={{ position: 'absolute', top: 2, left: tweaks[k] ? 16 : 2, width: 14, height: 14, borderRadius: '50%', background: '#fff', transition: 'left .15s' }}/>
      </span>
      <span style={{ fontSize: 13, color: 'var(--c-ink)' }}>{label}</span>
      <input type="checkbox" style={{ display: 'none' }} checked={tweaks[k]} onChange={e => set(k, e.target.checked)}/>
    </label>
  );
  const directions = [
    { id: 'editorial',  label: 'Editorial',   sub: 'Asymmetric serif, peeking screenshot' },
    { id: 'workshop',   label: 'Workshop',    sub: 'Deep green, trade-press' },

  return (
    <div style={{

      <div style={{ padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 8, background: 'var(--c-deep)', color: '#F0ECE2' }}>
        <SiteIcon name="sliders" size={14}/>

        <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: 'rgba(232,228,218,0.7)', cursor: 'pointer', fontSize: 16, padding: 0, lineHeight: 1 }}>×</button>
      </div>
      <Section title="Visual direction">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          {directions.map(d => (
            <button key={d.id} onClick={() => set('direction', d.id)} style={{
              display: 'flex', flexDirection: 'column', gap: 2, alignItems: 'flex-start',
              padding: '9px 10px', borderRadius: 7, cursor: 'pointer', textAlign: 'left',
              background: tweaks.direction === d.id ? 'var(--c-acc-lt)' : 'transparent',
              border: tweaks.direction === d.id ? '1px solid var(--c-acc)' : '1px solid transparent',
              fontFamily: 'inherit',

              <span style={{ fontSize: 11, color: 'var(--c-mute)' }}>{d.sub}</span>

      <Section title="Options">

  );
};

// Main app entry — composes everything, wires Tweaks, persists state.

function App() {
  const [tweaks, setTweaks] = useState(() => {
    try {
      const stored = localStorage.getItem('mason-site-tweaks');
      if (stored) return { ...window.__TWEAKS__, ...JSON.parse(stored) };
    } catch {}
    return window.__TWEAKS__;
  });

  useEffect(() => {
    try { localStorage.setItem('mason-site-tweaks', JSON.stringify(tweaks)); } catch {}
  }, [tweaks]);

  const [tweaksOpen, setTweaksOpen] = useState(false);

  // Edit-mode protocol
  useEffect(() => {
    const handler = (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', handler);
  }, []);

  // The Workshop direction is dark-hero — use deep nav to match.
  const navTone = tweaks.direction === 'workshop' ? 'deep' : 'paper';

  return (
    <div data-screen-label="01 Mason Marketing Site" style={{ minHeight: '100vh', background: 'var(--c-page)' }}>
      <SiteNav tone={navTone} />

      <HeroAndWorkflows
        direction={tweaks.direction}
        showAppPreview={tweaks.showAppPreview}
        showNumbers={tweaks.showNumbers}
      />

      <MetricsTable/>
      <Testimonial/>
      <Pricing/>
      <FAQ/>
      <CTASection/>
      <SiteFooter/>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

    (function () {

        var wrap = document.createElement('div');
        wrap.setAttribute('role', 'dialog');
        wrap.setAttribute('aria-live', 'polite');
        wrap.setAttribute('aria-label', 'Cookie consent');
        wrap.id = 'ud-cookie-banner';
        wrap.innerHTML =

              '<button type="button" class="ud-cc-btn ud-cc-reject" data-choice="reject">Reject</button>' +
              '<button type="button" class="ud-cc-btn ud-cc-accept" data-choice="accept">Accept</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(wrap);

        wrap.addEventListener('click', function (e) {
          var t = e.target;
          if (t && t.matches && t.matches('[data-choice]')) {
            try { localStorage.setItem(KEY, t.getAttribute('data-choice')); } catch (_) {}
